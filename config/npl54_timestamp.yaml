# Frame-sync grid snapping for the PCIe-NPL54.
#
# The card drives all four cameras from one MCU frame-sync generator, so the
# true start-of-frame instants lie on a uniform grid. What arrives at the host
# is that grid plus a pipeline latency plus scheduling jitter. Snapping each
# arrival back onto the recovered grid removes the jitter; `grid_snap_latency`
# removes the bias.
#
# Apply to every gscam node:
#   ros2 run gscam gscam_node --ros-args --params-file <this file> ...

/**:
  ros__parameters:
    grid_snap: true

    # "track": recover the grid from arrival times (card free-running).
    # "pps":   t = T_pps + grid_snap_pps_phase + n / fps. Use this when the
    #          card is in "PPS input and frame-sync" mode and the host clock is
    #          PTP-synced to the same grandmaster that drives the PPS. Nothing
    #          is estimated; the arrival time only picks the slot n.
    #          grid_snap_latency and the tracking-loop gains are unused.
    grid_snap_mode: track

    # pps mode only: seconds from the PPS edge to the instant the stamp should
    # represent for frame 0. Includes the card's per-port frame-sync phase
    # shift, if any, plus the trigger-to-exposure delay (exposure, and the
    # point in it you want stamped). Set per camera if the ports are shifted.
    grid_snap_pps_phase: 0.0

    # pps mode only: the expected arrival delay after the grid slot is
    #   grid_snap_pps_arrival_phase + grid_snap_pps_frame_delay / fps.
    #
    # arrival_phase is where in the frame period frames reach the host, in
    # [0, 1/fps). It only has to be right to within half a period, and the log
    # prints "measured arrival phase" every report period: on a new setup run
    # once with 0.0, then copy that value here.
    #
    # frame_delay is how many whole frames the pipeline adds on top. The phase
    # measurement cannot see it, so it must come from an external reference
    # (an LED driven by the PPS, or LiDAR-camera time alignment). Each step
    # shifts every timestamp by one frame period.
    #
    # Both are tunable at runtime:
    #   ros2 param set /<node> grid_snap_pps_frame_delay 2
    grid_snap_pps_arrival_phase: 0.0
    grid_snap_pps_frame_delay: 0

    # Nominal frame rate of the grid. 0 falls back to `camera_frame_rate`.
    grid_snap_fps: 30.0

    # The whole sensor-to-ROS latency (exposure, readout, ISP, GMSL2, FPGA,
    # DMA, v4l2loopback, GStreamer). It is normally LARGER than one frame
    # period, e.g. 0.233 s at 30 fps is seven grid steps.
    #
    # track mode only: subtracted from every snapped timestamp. Getting it
    # wrong by one frame period biases every timestamp by 33 ms.
    #
    # Measure it once, then keep it fixed. Tunable at runtime while calibrating:
    #   ros2 param set /<node> grid_snap_latency 0.233
    grid_snap_latency: 0.0

    # Tracking loop. Raise phase_gain to follow the grid faster, lower it to
    # filter jitter harder. period_gain tracks the card's oscillator when it is
    # free-running instead of locked to PPS; 0.0 pins the rate at nominal.
    grid_snap_phase_gain: 0.05
    grid_snap_period_gain: 0.0005

    # Residuals beyond this fraction of the grid spacing are treated as
    # outliers and do not move the loop (0.35 = 11.7 ms at 30 fps).
    grid_snap_reset_threshold: 0.35

    # Gap after which the loop gives up and re-anchors, in seconds.
    grid_snap_max_gap: 2.0

    # Per-frame [residual_s, step, measured_fps, flags] on ~/grid_diagnostics,
    # where flags bit0 = outlier and bit1 = reset. Record it to histogram the
    # residuals, which is how you check the jitter is small enough to snap.
    grid_snap_diagnostics: true

    # Seconds between the aggregate log lines. 0 disables them.
    grid_snap_report_period: 10.0
